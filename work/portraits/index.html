<!doctype html>
<html lang="en" data-theme="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04060c">
<title>Portraits | Full Circle Studios</title>
<meta name="description" content="Natural, relaxed portraits that look like you on a good day.">
<!-- GENERATED by tools/build.mjs from photos/categories.json: edit that file (or the photos folder), not this page -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e; --bg2:#151519; --card:#1b1b20; --line:#2a2a31;
  --text:#f3f1ec; --muted:#a3a1a8; --accent:#ff6a2b; --accent2:#ffb347; --on-accent:#120a05;
}
/* color samples: ?theme=gold | teal | red | light */
:root[data-theme="gold"]{--bg:#0b0b0a;--bg2:#141412;--card:#1a1916;--line:#2c2a24;--accent:#d4af37;--accent2:#f0d98c;--on-accent:#141006}
:root[data-theme="teal"]{--bg:#081114;--bg2:#0e1a1e;--card:#122228;--line:#1f3640;--text:#eef6f6;--muted:#9bb3b8;--accent:#2ec4b6;--accent2:#a8f0e6;--on-accent:#04201d}
:root[data-theme="red"]{--bg:#0a0a0a;--bg2:#131313;--card:#1a1a1a;--line:#2b2b2b;--text:#f5f5f5;--muted:#a0a0a0;--accent:#e63946;--accent2:#ffffff;--on-accent:#ffffff}
:root[data-theme="light"]{--bg:#f4efe6;--bg2:#ebe4d8;--card:#fbf8f2;--line:#d9cfbf;--text:#16130f;--muted:#6b6358;--accent:#1f4e79;--accent2:#b07d2b;--on-accent:#ffffff}
/* round 2 (sister's notes 11/22): duo = orange + teal as one palette; blue = cinematic, one color in shades; warm = earthy/editorial */
:root{--ring:var(--accent);--glow2:transparent;--band1:var(--accent);--band2:color-mix(in srgb,var(--accent) 60%,var(--accent2));--on-band:var(--on-accent)}
:root[data-theme="duo"]{--bg:#0a1216;--bg2:#0f1b21;--card:#13232a;--line:#20363f;--text:#f5efe6;--muted:#9fb1b5;--accent:#ff6a2b;--accent2:#35c2b3;--on-accent:#140a04;--ring:#35c2b3;--glow2:#35c2b333;--band1:#0f5f5a;--band2:#0a1216;--on-band:#f5efe6}
:root[data-theme="blue"]{--bg:#04060c;--bg2:#08101f;--card:#0c1630;--line:#1a2950;--text:#edf1fa;--muted:#8d9bbb;--accent:#2d6bff;--accent2:#a9bde6;--on-accent:#ffffff;--ring:#4f86ff;--glow2:#0b2a8a44;--band1:#0b2a8a;--band2:#04060c;--on-band:#edf1fa}
:root[data-theme="warm"]{--bg:#ece4d8;--bg2:#e2d8c8;--card:#f5efe6;--line:#d2c5b1;--text:#1e1b17;--muted:#6e6456;--accent:#2f4a3a;--accent2:#b8694a;--on-accent:#f5efe6;--ring:#b8694a;--glow2:#b8694a22;--band1:#2f4a3a;--band2:#22372b;--on-band:#f5efe6}
:root[data-theme="warm"] h1,:root[data-theme="warm"] h2,:root[data-theme="warm"] h3,:root[data-theme="warm"] .logo,:root[data-theme="warm"] .price .amt,:root[data-theme="warm"] .card-mock .name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;letter-spacing:0}
:root[data-theme="warm"] .hero h1{font-style:italic}
:root[data-theme="blue"] h1,:root[data-theme="blue"] h2{text-transform:uppercase;letter-spacing:.02em}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
img,video{display:block;max-width:100%}
.wrap{width:min(1120px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:"Archivo Black",Inter,sans-serif;font-weight:400;letter-spacing:-.01em;line-height:1.05}
.eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);font-weight:600}

/* nav */
nav{position:fixed;inset:0 0 auto 0;z-index:20;background:linear-gradient(color-mix(in srgb,var(--bg) 92%,transparent),transparent)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Archivo Black";font-size:1.05rem;letter-spacing:.02em}
.ring{width:30px;height:30px;border-radius:50%;border:3px solid var(--accent);position:relative}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--accent2)}
nav ul{display:flex;gap:26px;list-style:none;font-size:.92rem;color:var(--muted)}
nav ul a:hover{color:var(--text)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);font-weight:600;padding:12px 22px;border-radius:999px;font-size:.95rem;transition:transform .15s,background .15s;border:0;cursor:pointer}
.btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
@media (max-width:760px){nav ul{display:none}}
@media (max-width:420px){.logo{font-size:.85rem;gap:8px}.ring{width:24px;height:24px}nav .btn{padding:10px 18px}}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;align-items:end;overflow:hidden}
.hero-media{position:absolute;inset:0;background:
  radial-gradient(60% 50% at 75% 30%,#ff6a2b33,transparent 70%),
  radial-gradient(50% 60% at 15% 80%,#ffb34722,transparent 70%),
  linear-gradient(160deg,#18181d,#0c0c0e 60%)}
.hero-media video{width:100%;height:100%;object-fit:cover;opacity:.55}
.hero-media{background:radial-gradient(60% 50% at 75% 35%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),radial-gradient(50% 60% at 15% 85%,var(--glow2),transparent 70%),linear-gradient(160deg,var(--bg2),var(--bg) 60%)!important}
.orbit{position:absolute;right:6vw;top:50%;transform:translateY(-50%);width:min(46vw,560px);aspect-ratio:1}
.orbit .ringline{position:absolute;inset:0;border-radius:50%;border:2px solid color-mix(in srgb,var(--ring) 45%,transparent);animation:spin 30s linear infinite}
.orbit .ringline::after{content:"";position:absolute;top:-7px;left:50%;width:14px;height:14px;border-radius:50%;background:var(--ring);box-shadow:0 0 24px var(--ring)}
.orbit .photos{position:absolute;inset:7%;border-radius:50%;overflow:hidden;background:var(--bg2)}
.orbit .photos img,.orbit .photos video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.2s ease,transform 4.5s ease}
.orbit .photos img.on,.orbit .photos video.on{opacity:1;transform:scale(1)}
.orbit .photos video{transform:none}
.orbit .label.hide{opacity:0}
.orbit .label{transition:opacity .4s}
.orbit .label{position:absolute;left:50%;bottom:2%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;padding:8px 18px;border-radius:999px;white-space:nowrap;box-shadow:0 8px 24px #0006}
.orbit .dots{position:absolute;left:50%;bottom:-28px;transform:translateX(-50%);display:flex;gap:8px}
.orbit .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.orbit .dots i.on{background:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.orbit .ringline{animation:none}}
@media (max-width:860px){.hero{align-items:start}.orbit{position:relative;right:auto;top:auto;transform:none;width:min(78vw,380px);margin:96px auto 60px}}
.hero .wrap{position:relative;padding:0 0 12vh}
.hero h1{font-size:clamp(2.6rem,8vw,6.2rem);max-width:12ch;margin:14px 0 18px}
.hero h1 span{color:var(--accent)}
.hero p{max-width:46ch;color:var(--text);opacity:.85;font-size:1.08rem;margin-bottom:28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}

/* sections */
section{padding:96px 0}
.head{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.head h2{font-size:clamp(2rem,4.5vw,3.2rem);max-width:16ch}
.head p{color:var(--muted);max-width:42ch}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.svc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.svc:hover{border-color:var(--accent);transform:translateY(-3px)}
.svc .n{font-family:"Archivo Black";color:var(--accent);font-size:.9rem}
.svc h3{font-size:1.35rem}
.svc p{color:var(--muted);font-size:.95rem}
.svc ul{list-style:none;font-size:.9rem;color:var(--text);opacity:.9;display:grid;gap:4px;margin-top:4px}
.svc li::before{content:"— ";color:var(--accent)}

/* work: category cards (generated by tools/build.mjs from photos/categories.json) */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cat{position:relative;display:block;aspect-ratio:4/5;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--card),var(--bg2));border:1px solid var(--line);transition:transform .25s ease,box-shadow .25s ease,border-color .25s}
.cat img{width:100%;height:100%;object-fit:cover;transition:filter .3s ease,transform .6s ease}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,#000c);pointer-events:none}
.cat-ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;border:1px dashed var(--line);border-radius:16px;margin:10px}
.cat-name{position:absolute;left:16px;right:16px;bottom:16px;z-index:1;font-family:"Archivo Black",Inter,sans-serif;font-size:1.3rem;line-height:1.1;color:#fff;transition:transform .25s ease}
.cat-cta{position:absolute;left:0;right:0;bottom:0;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);color:#fff;font-weight:600;font-size:.88rem;opacity:0;transform:translateY(8px);transition:opacity .25s ease,transform .25s ease}
.cat-cta small{font-weight:500;color:var(--accent2);font-size:.78rem;white-space:nowrap}
.cat:hover,.cat:focus-visible{transform:translateY(-6px);border-color:var(--accent);box-shadow:0 18px 40px #0007}
.cat:hover img,.cat:focus-visible img{filter:brightness(.72)}
.cat:hover .cat-cta,.cat:focus-visible .cat-cta{opacity:1;transform:none}
.cat:hover .cat-name,.cat:focus-visible .cat-name{transform:translateY(-46px)}
.cat:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
/* touch screens: no hover, so the bar is always there */
@media (hover:none){.cat-cta{opacity:1;transform:none}.cat .cat-name{transform:translateY(-46px)}.cat:hover{transform:none;box-shadow:none}.cat:hover img{filter:none}}
@media (max-width:1000px){.cats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.cats{grid-template-columns:1fr}.cat{aspect-ratio:3/2}}
@media (prefers-reduced-motion:reduce){.cat,.cat img,.cat-cta,.cat-name{transition:none}}

/* gallery pages (work/<slug>/index.html) + lightbox */
.g-head{padding:130px 0 36px}
.g-head .back{display:inline-block;color:var(--muted);font-size:.9rem;margin-bottom:22px}
.g-head .back:hover{color:var(--text)}
.g-head h1{font-size:clamp(2.4rem,7vw,4.6rem);margin:10px 0 12px}
:root[data-theme="blue"] .g-head h1{text-transform:uppercase;letter-spacing:.02em}
.g-head p{color:var(--muted);max-width:56ch;font-size:1.05rem;margin-bottom:22px}
.g-body{padding:0 0 96px}
.g-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g-grid .ph{display:block;width:100%;padding:0;border:0;cursor:zoom-in;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--bg2);position:relative}
.g-grid .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease,filter .3s}
.g-grid .ph:hover img{transform:scale(1.03);filter:brightness(.9)}
.g-grid .ph:focus-visible{outline:3px solid var(--accent2);outline-offset:3px}
.g-grid .ph-empty{display:grid;place-items:center;border:1px dashed var(--line);cursor:default;color:var(--muted);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:1000px){.g-grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.g-grid{grid-template-columns:1fr}.g-head{padding-top:110px}}
.lb{position:fixed;inset:0;z-index:100;background:#000000f5;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.lb[hidden]{display:none}
.lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:100%}
.lb img{max-width:min(92vw,1600px);max-height:84vh;width:auto;height:auto;object-fit:contain;border-radius:6px;transition:opacity .2s}
.lb img.loading{opacity:.85}
.lb figcaption{color:#cfd3dc;font-size:.85rem;letter-spacing:.08em}
.lb button{position:absolute;background:#ffffff1a;color:#fff;border:1px solid #ffffff33;border-radius:50%;width:52px;height:52px;font-size:1.9rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.lb button:hover{background:#ffffff33}
.lb button:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.lb button[hidden]{display:none}
.lb-x{top:16px;right:16px}
.lb-prev{left:16px;top:50%;transform:translateY(-50%)}
.lb-next{right:16px;top:50%;transform:translateY(-50%)}
@media (max-width:640px){.lb img{max-width:100vw;max-height:78vh;border-radius:0}.lb-prev,.lb-next{top:auto;bottom:18px;transform:none}.lb-prev{left:calc(50% - 70px)}.lb-next{right:calc(50% - 70px)}}
html.lb-open{overflow:hidden}
/* reviews (work/reviews.js): homepage "Kind words", ★ tag on gallery tiles, review under the photo in the lightbox */
.rv-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.rv{margin:0;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.rv-ph{display:block;aspect-ratio:4/3;border-radius:12px;overflow:hidden}
.rv-ph img{width:100%;height:100%;object-fit:cover}
.rv p{font-size:1rem;line-height:1.5;white-space:pre-line}
.rv cite{display:block;margin-top:8px;font-style:normal;color:var(--accent2);font-weight:600;font-size:.9rem}
.rv-stars{color:#ffc94d;letter-spacing:2px;font-size:.95rem}.rv-stars i{font-style:normal;color:var(--line)}
@media (max-width:1000px){.rv-list{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.rv-list{grid-template-columns:1fr}}
.g-grid .rv-tag{position:absolute;left:10px;top:10px;background:color-mix(in srgb,var(--bg) 80%,transparent);color:#ffc94d;font-size:.75rem;font-weight:600;padding:4px 10px;border-radius:999px}
.lb-review{max-width:min(640px,92vw);text-align:center}
.lb-review .rv{background:transparent;border:0;padding:4px 0;gap:4px}
.lb-review .rv p{color:#f1f3f8;font-size:.98rem}
.lb.has-review img{max-height:64vh}
.lb-rate{color:#cfd3dc;font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.lb-rate:hover{color:#fff}
.lb-rate:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.lb-review[hidden],.lb-rate[hidden]{display:none}
@media (max-width:640px){.lb figure{padding-bottom:84px}.lb.has-review img{max-height:52vh}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* sports band */
.band{background:linear-gradient(120deg,var(--band1),var(--band2));color:var(--on-band)}
.band .wrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.band h2{font-size:clamp(2rem,5vw,3.4rem)}
.band p{font-size:1.05rem;margin:16px 0 22px;max-width:48ch}
.band .eyebrow{color:inherit;opacity:.75}
.band .btn{background:#111;color:#fff}
:root[data-theme="duo"] .band .btn,:root[data-theme="blue"] .band .btn,:root[data-theme="warm"] .band .btn{background:var(--accent2);color:#0b0b0b}
.card-mock{aspect-ratio:3/4;max-width:320px;justify-self:center;border-radius:20px;background:#111;color:#f3f1ec;padding:22px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 30px 60px #0005;transform:rotate(3deg)}
.card-mock .top{display:flex;justify-content:space-between;font-size:.75rem;color:var(--accent2);letter-spacing:.14em;text-transform:uppercase}
.card-mock .photo{flex:1;margin:14px 0;border-radius:12px;background:#222 url(media/g8.jpg) center/cover}
.card-mock .name{font-family:"Archivo Black";font-size:1.6rem}
.card-mock .stats{display:flex;gap:16px;font-size:.8rem;color:#a3a1a8;margin-top:6px}
.card-mock .stats b{display:block;color:#fff;font-size:1.1rem}
@media (max-width:760px){.band .wrap{grid-template-columns:1fr}}

/* pricing */
.prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.price{border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--bg2)}
.price h3{font-size:1.1rem;margin-bottom:6px}
.price .amt{font-family:"Archivo Black";font-size:2.2rem;color:var(--accent);margin:8px 0}
.price .amt small{font-family:Inter;font-size:.85rem;color:var(--muted)}
.price p{color:var(--muted);font-size:.92rem}
.price{position:relative;display:flex;flex-direction:column;min-width:0}
.price .amt{overflow-wrap:anywhere}
.price ul{list-style:none;font-size:.9rem;display:grid;gap:4px;margin-top:12px}
.price li::before{content:"— ";color:var(--accent)}
.price .amt s{color:var(--muted);font-size:.55em;margin-right:4px;text-decoration-thickness:2px}
.price .badge{position:absolute;top:-11px;right:18px;background:var(--accent2);color:var(--bg);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.price.on-sale{border-color:var(--accent2)}
.price .samples{margin-top:auto;padding-top:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:center}
.price .samples img{aspect-ratio:1;object-fit:cover;border-radius:8px;width:100%}
.price .samples span{grid-column:1/-1;font-size:.85rem;font-weight:600;color:var(--accent2)}
.price a.samples:hover span{text-decoration:underline}
.price .samples.empty{display:block;margin-top:16px;padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);font-size:.8rem;text-align:center;letter-spacing:.08em}
.note{color:var(--muted);font-size:.9rem;margin-top:20px}

/* about */
.about{display:grid;grid-template-columns:auto 1fr;gap:48px;align-items:center}
/* Dan's profile photo: original he sent 11/22 (ig\dan-original.jpg), cropped square 600px -> media\dan.jpg */
.about .avatar{width:170px;aspect-ratio:1;border-radius:50%;padding:8px;border:2px solid color-mix(in srgb,var(--ring) 60%,transparent);box-shadow:0 0 40px color-mix(in srgb,var(--ring) 25%,transparent)}
.about .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.about .portrait{aspect-ratio:4/5;border-radius:20px;background:linear-gradient(160deg,#1f1f25,#121216);border:1px solid var(--line);display:grid;place-items:center;color:#5d5b63;font-size:.8rem;letter-spacing:.12em}
.about h2{font-size:clamp(2rem,4.5vw,3rem);margin:12px 0 18px}
.about p{color:var(--text);opacity:.85;margin-bottom:14px;max-width:56ch}
@media (max-width:760px){.about{grid-template-columns:1fr}}

/* book */
form{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px}
form .full{grid-column:1/-1}
label{font-size:.82rem;color:var(--muted);display:grid;gap:6px}
input,select,textarea{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:12px 14px;font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
textarea{min-height:110px;resize:vertical}
@media (max-width:640px){form{grid-template-columns:1fr;padding:20px}}

footer{border-top:1px solid var(--line);padding:36px 0;color:var(--muted);font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
</style>
</head>
<body class="gallery-page" data-slug="portraits">
<nav><div class="wrap">
  <a href="../../" class="logo"><span class="ring"></span>FULL CIRCLE STUDIOS</a>
  <ul><li><a href="../../#services">Services</a></li><li><a href="../../#work">Work</a></li><li><a href="../../#sports">Sports</a></li><li><a href="../../#pricing">Pricing</a></li><li><a href="../../#about">About</a></li></ul>
  <a href="../../#book" class="btn">Book</a>
</div></nav>

<main>
<section class="g-head"><div class="wrap">
  <a class="back" href="../../#work">← All work</a>
